<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parlak Clean - Müşteri Takip</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        h1 {
            text-align: center;
            color: #222;
        }

        .card {
            background: white;
            padding: 20px;
            margin-top: 20px;
            border-radius: 15px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        input, textarea, button {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-top: 8px;
            margin-bottom: 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        button {
            background: #1677ff;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #0d5fd1;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🧼 Parlak Clean</h1>

    <div class="card">

        <h2>Müşteri Ekle</h2>

        <input type="text" placeholder="Ad Soyad">

        <input type="tel" placeholder="Telefon">

        <textarea placeholder="Adres"></textarea>

        <input type="date">

        <input type="number" placeholder="Halı M²">

        <input type="number" placeholder="Tutar (TL)">

        <button>💾 Müşteriyi Kaydet</button>

    </div>

</div>

</body>
</html>
