/* =========================
   SAYFA
========================= */

function sayfaAc(pageId, navId){

    document.querySelectorAll(".page")
    .forEach(function(page){
        page.classList.remove("active");
    });

    const page = document.getElementById(pageId);

    if(page){
        page.classList.add("active");
    }

    document.querySelectorAll(".nav-btn")
    .forEach(function(btn){
        btn.classList.remove("active");
    });

    const nav = document.getElementById(navId);

    if(nav){
        nav.classList.add("active");
    }

    window.scrollTo(0,0);
}

/* =========================
   GÜVENLİ METİN
========================= */

function guvenli(text){

    return String(text ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =========================
   OTURUMU AL
========================= */

async function aktifOturumuAl(){

    const {
        data,
        error
    } = await client.auth.getSession();

    if(error){

        console.error(
            "Session hatası:",
            error
        );

        return null;
    }

    return data.session || null;
}


/* =========================
   MÜŞTERİ KAYDET
========================= */

async function musteriKaydet(){

    const ad =
        document.getElementById("adSoyad")
        .value.trim();

    const telefon =
        document.getElementById("telefon")
        .value.trim();

    const adres =
        document.getElementById("adres")
        .value.trim();

    const alim =
        document.getElementById("alimTarihi")
        .value || null;

    const teslim =
        document.getElementById("teslimTarihi")
        .value || null;

    const m2Value =
        document.getElementById("haliM2")
        .value;

    const tutarValue =
        document.getElementById("tutar")
        .value;

    const m2 =
        m2Value !== ""
        ? Number(m2Value)
        : null;

    const tutar =
        tutarValue !== ""
        ? Number(tutarValue)
        : null;

    const notlar =
        document.getElementById("notlar")
        .value.trim();


    /* AD KONTROLÜ */

    if(!ad){

        document.getElementById("saveMessage")
        .innerHTML =
        '<div class="message error">' +
        '⚠️ Ad Soyad gir.' +
        '</div>';

        return;
    }


    /* =========================
       OTURUMU GETİR
    ========================= */

    const session =
        await aktifOturumuAl();


    if(!session){

        document.getElementById("saveMessage")
        .innerHTML =
        '<div class="message error">' +
        '❌ Oturum bulunamadı. Sayfayı yenileyip tekrar giriş yap.' +
        '</div>';

        console.error(
            "Supabase session bulunamadı."
        );

        return;
    }


    /* =========================
       USER ID
       getUser() KULLANMIYORUZ
    ========================= */

    const user =
        session.user;


    if(!user || !user.id){

        document.getElementById("saveMessage")
        .innerHTML =
        '<div class="message error">' +
        '❌ Kullanıcı bilgisi bulunamadı.' +
        '</div>';

        return;
    }


    console.log(
        "Aktif kullanıcı:",
        user.id
    );


    /* =========================
       KAYIT
    ========================= */

    const kayit = {

        user_id: user.id,

        ad_soyad: ad,

        telefon: telefon,

        adres: adres,

        alim_tarihi: alim,

        teslim_tarihi: teslim,

        hali_m2: m2,

        tutar: tutar,

        notlar: notlar

    };


    document.getElementById("saveMessage")
    .innerHTML =
    '<div class="message">' +
    '⏳ Müşteri kaydediliyor...' +
    '</div>';


    const {
        data,
        error
    } =
    await client
    .from("Müşteriler")
    .insert(kayit)
    .select()
    .single();


    if(error){

        console.error(
            "Müşteri kayıt hatası:",
            error
        );

        document.getElementById("saveMessage")
        .innerHTML =
        '<div class="message error">' +
        '❌ Kayıt yapılamadı:<br>' +
        guvenli(error.message) +
        '</div>';

        return;
    }


    console.log(
        "Kayıt başarılı:",
        data
    );


    document.getElementById("saveMessage")
    .innerHTML =
    '<div class="message success">' +
    '✅ Müşteri başarıyla kaydedildi!' +
    '</div>';


    formTemizle();

    await musterileriGetir();

}


/* =========================
   FORM TEMİZLE
========================= */

function formTemizle(){

    document.getElementById("adSoyad").value = "";
    document.getElementById("telefon").value = "";
    document.getElementById("adres").value = "";
    document.getElementById("alimTarihi").value = "";
    document.getElementById("teslimTarihi").value = "";
    document.getElementById("haliM2").value = "";
    document.getElementById("tutar").value = "";
    document.getElementById("notlar").value = "";
}


/* =========================
   MÜŞTERİLERİ GETİR
========================= */

async function musterileriGetir(){

    const session =
        await aktifOturumuAl();


    if(!session){

        console.warn(
            "Müşteri listesi için session yok."
        );

        return;
    }


    const {
        data,
        error
    } =
    await client
    .from("Müşteriler")
    .select("*")
    .order(
        "created_at",
        {
            ascending:false
        }
    );


    if(error){

        console.error(
            "Müşteriler alınamadı:",
            error
        );

        document.getElementById("musteriListesi")
        .innerHTML =
        '<div class="message error">' +
        '❌ Veriler alınamadı:<br>' +
        guvenli(error.message) +
        '</div>';

        return;
    }


    const musteriler =
        data || [];


    /* =========================
       MÜŞTERİ ARAMA
    ========================= */

    const arama =
        (
            document.getElementById("arama")
            ?.value || ""
        )
        .trim()
        .toLowerCase();


    const filtreli =
        musteriler.filter(function(m){

            if(!arama){
                return true;
            }

            return (

                String(m.ad_soyad || "")
                .toLowerCase()
                .includes(arama)

                ||

                String(m.telefon || "")
                .toLowerCase()
                .includes(arama)

            );

        });


    /* =========================
       TOPLAM HESAPLAR
    ========================= */

    const toplamM2 =
        musteriler.reduce(
            function(toplam,m){

                return toplam +
                Number(m.hali_m2 || 0);

            },
            0
        );


    const toplamTutar =
        musteriler.reduce(
            function(toplam,m){

                return toplam +
                Number(m.tutar || 0);

            },
            0
        );


    document.getElementById("toplamMusteri")
    .textContent =
        musteriler.length;


    document.getElementById("toplamIs")
    .textContent =
        musteriler.length;


    document.getElementById("toplamM2")
    .textContent =
        toplamM2.toLocaleString("tr-TR");


    document.getElementById("toplamTutar")
    .textContent =
        toplamTutar.toLocaleString("tr-TR")
        + " TL";


    document.getElementById("kasaToplam")
    .textContent =
        toplamTutar.toLocaleString("tr-TR")
        + " TL";


    document.getElementById("kasaM2")
    .textContent =
        toplamM2.toLocaleString("tr-TR");


    /* =========================
       MÜŞTERİ LİSTESİ
    ========================= */

    if(!filtreli.length){

        document.getElementById("musteriListesi")
        .innerHTML =
        '<div class="empty">' +
        '👥 Henüz müşteri kaydı yok.' +
        '</div>';

    }else{

        document.getElementById("musteriListesi")
        .innerHTML =

        filtreli.map(function(m){

            return `

            <div class="customer">

                <div class="customer-name">
                    ${guvenli(m.ad_soyad)}
                </div>

                <div class="customer-phone">
                    📞 ${guvenli(m.telefon || "-")}
                </div>

                <div class="customer-info">

                    📍 ${guvenli(m.adres || "-")}<br>

                    📅 Alım:
                    ${guvenli(m.alim_tarihi || "-")}<br>

                    🚚 Teslim:
                    ${guvenli(m.teslim_tarihi || "-")}<br>

                    🧼 ${m.hali_m2 ?? 0} m²
                    &nbsp; • &nbsp;
                    💰 ${m.tutar ?? 0} TL

                    ${
                        m.notlar
                        ?
                        "<br>📝 " +
                        guvenli(m.notlar)
                        :
                        ""
                    }

                </div>

                <div class="actions">

                    <button
                        class="action"
                        onclick="ara('${telefonJS(m.telefon)}')">
                        📞 Ara
                    </button>

                    <button
                        class="action green"
                        onclick="whatsapp('${telefonJS(m.telefon)}')">
                        💬 WhatsApp
                    </button>

                    <button
                        class="action red"
                        onclick="musteriSil('${m.id}')">
                        🗑️ Sil
                    </button>

                </div>

            </div>

            `;

        }).join("");

    }


    /* =========================
       İŞLER
    ========================= */

    const isArama =
        (
            document.getElementById("isArama")
            ?.value || ""
        )
        .trim()
        .toLowerCase();


    const isler =
        musteriler.filter(function(m){

            if(!isArama){
                return true;
            }

            return (

                String(m.ad_soyad || "")
                .toLowerCase()
                .includes(isArama)

                ||

                String(m.telefon || "")
                .toLowerCase()
                .includes(isArama)

            );

        });


    document.getElementById("islerListesi")
    .innerHTML =

        isler.length

        ?

        isler.map(function(m){

            return `

            <div class="customer">

                <div class="customer-name">
                    ${guvenli(m.ad_soyad)}
                </div>

                <div class="customer-info">

                    📅 Alım:
                    ${guvenli(m.alim_tarihi || "-")}<br>

                    🚚 Teslim:
                    ${guvenli(m.teslim_tarihi || "-")}<br>

                    🧼 ${m.hali_m2 ?? 0} m²
                    &nbsp; • &nbsp;
                    💰 ${m.tutar ?? 0} TL

                </div>

            </div>

            `;

        }).join("")

        :

        '<div class="empty">İş bulunamadı.</div>';


    /* =========================
       KASA
    ========================= */

    document.getElementById("kasaListe")
    .innerHTML =

        musteriler.length

        ?

        musteriler
        .slice(0,10)
        .map(function(m){

            return `

            <div class="customer">

                <div class="customer-name">
                    ${guvenli(m.ad_soyad)}
                </div>

                <div class="customer-info">

                    💰 ${m.tutar ?? 0} TL<br>

                    🧼 ${m.hali_m2 ?? 0} m²

                </div>

            </div>

            `;

        }).join("")

        :

        '<div class="empty">' +
        'Henüz kayıt yok.' +
        '</div>';


    /* =========================
       YAKLAŞAN TESLİMLER
    ========================= */

    const teslimler =
        musteriler
        .filter(function(m){

            return !!m.teslim_tarihi;

        })
        .sort(function(a,b){

            return String(a.teslim_tarihi)
            .localeCompare(
                String(b.teslim_tarihi)
            );

        })
        .slice(0,5);


    document.getElementById("yaklasanIsler")
    .innerHTML =

        teslimler.length

        ?

        teslimler.map(function(m){

            return `

            <div class="customer">

                <div class="customer-name">
                    ${guvenli(m.ad_soyad)}
                </div>

                <div class="customer-info">

                    🚚 Teslim:
                    ${guvenli(m.teslim_tarihi)}<br>

                    💰 ${m.tutar ?? 0} TL

                </div>

            </div>

            `;

        }).join("")

        :

        '<div class="empty">' +
        'Yaklaşan teslimat yok.' +
        '</div>';

}


/* =========================
   TELEFON
========================= */

function telefonJS(text){

    return String(text || "")
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'");
}


function ara(telefon){

    const temiz =
        String(telefon)
        .replace(/\D/g,"");


    if(!temiz){

        alert(
            "Telefon numarası bulunamadı."
        );

        return;
    }


    location.href =
        "tel:" + temiz;
}


function whatsapp(telefon){

    let temiz =
        String(telefon)
        .replace(/\D/g,"");


    if(!temiz){

        alert(
            "Telefon numarası bulunamadı."
        );

        return;
    }


    if(temiz.startsWith("0")){

        temiz =
            "90" +
            temiz.substring(1);

    }


    if(!temiz.startsWith("90")){

        temiz =
            "90" + temiz;

    }


    window.open(
        "https://wa.me/" +
        temiz,
        "_blank"
    );
}


/* =========================
   MÜŞTERİ SİL
========================= */

async function musteriSil(id){

    if(!confirm(
        "Bu müşteriyi silmek istediğine emin misin?"
    )){

        return;
    }


    const session =
        await aktifOturumuAl();


    if(!session){

        alert(
            "Oturum bulunamadı. Sayfayı yenile."
        );

        return;
    }


    const {
        error
    } =
    await client
    .from("Müşteriler")
    .delete()
    .eq("id",id);


    if(error){

        console.error(
            "Silme hatası:",
            error
        );

        alert(
            "Silinemedi: " +
            error.message
        );

        return;
    }


    await musterileriGetir();
}


/* =========================
   TARİH
========================= */

function bugunGoster(){

    const tarih =
        new Date();


    const el =
        document.getElementById(
            "bugunTarihi"
        );


    if(el){

        el.textContent =
            tarih.toLocaleDateString(
                "tr-TR",
                {
                    weekday:"long",
                    day:"numeric",
                    month:"long",
                    year:"numeric"
                }
            );

    }
}


/* =========================
   UYGULAMAYI AÇ
========================= */

async function uygulamayiAc(){

    bugunGoster();

    await musterileriGetir();
}


/* =========================
   OTURUM KONTROL
========================= */

async function oturumKontrol(){

    console.log(
        "Oturum kontrol ediliyor..."
    );


    const session =
        await aktifOturumuAl();


    if(session){

        console.log(
            "Oturum bulundu:",
            session.user.id
        );


        await uygulamayiAc();

    }else{

        console.warn(
            "Oturum yok."
        );

        const msg =
            document.getElementById(
                "musteriListesi"
            );


        if(msg){

            msg.innerHTML =
            '<div class="message error">' +
            '❌ Oturum bulunamadı. Lütfen giriş yap.' +
            '</div>';

        }

    }
}


/* =========================
   ÇIKIŞ
========================= */

async function logout(){

    await client.auth.signOut();

    location.reload();
}


/* =========================
   OTURUM DEĞİŞİKLİĞİNİ DİNLE
========================= */

client.auth.onAuthStateChange(
    async function(event, session){

        console.log(
            "Auth:",
            event
        );


        if(
            event === "SIGNED_IN" &&
            session
        ){

            await uygulamayiAc();

        }

    }
);


/* =========================
   BAŞLAT
========================= */

bugunGoster();

oturumKontrol();

</script>
