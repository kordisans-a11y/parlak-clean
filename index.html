<script>

/* =====================================================
   PARLAK CLEAN - SUPABASE
===================================================== */

const SUPABASE_URL =
"https://ynbcnhsipsktgrnqidfa.supabase.co";

const SUPABASE_KEY =
"sb_publishable_SpfDVJZCd9Q7tP2Ic25hUQ_vJlnVic7";

const client = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
        auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true
        }
    }
);


/* =====================================================
   SAYFA
===================================================== */

function sayfaAc(pageId, navId){

    document.querySelectorAll(".page").forEach(function(page){
        page.classList.remove("active");
    });

    const page = document.getElementById(pageId);

    if(page){
        page.classList.add("active");
    }

    document.querySelectorAll(".nav-btn").forEach(function(btn){
        btn.classList.remove("active");
    });

    const nav = document.getElementById(navId);

    if(nav){
        nav.classList.add("active");
    }

    window.scrollTo(0,0);
}


/* =====================================================
   FORM
===================================================== */

function musteriFormAc(){

    sayfaAc(
        "pageCustomers",
        "navCustomers"
    );

    const form =
        document.getElementById("formBox");

    if(form){
        form.classList.remove("hidden");
    }
}


function formKapat(){

    const form =
        document.getElementById("formBox");

    if(form){
        form.classList.add("hidden");
    }

    const msg =
        document.getElementById("saveMessage");

    if(msg){
        msg.innerHTML = "";
    }
}


/* =====================================================
   GÜVENLİ METİN
===================================================== */

function guvenli(text){

    return String(text ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =====================================================
   AKTİF OTURUM
===================================================== */

async function aktifOturumuAl(){

    console.log("Supabase oturum kontrolü başladı...");


    /* 1 - Normal session kontrolü */

    let {
        data,
        error
    } = await client.auth.getSession();


    if(error){

        console.error(
            "getSession hatası:",
            error
        );

    }


    let session =
        data?.session || null;


    /* 2 - Session yoksa refresh dene */

    if(!session){

        console.log(
            "Session bulunamadı. Refresh deneniyor..."
        );


        const refresh =
            await client.auth.refreshSession();


        if(
            !refresh.error &&
            refresh.data?.session
        ){

            session =
                refresh.data.session;

        }

    }


    /* 3 - Hâlâ yoksa çık */

    if(!session){

        console.warn(
            "Geçerli Supabase oturumu bulunamadı."
        );

        return null;
    }


    /* 4 - Token gerçekten geçerli mi kontrol et */

    const {
        data: userData,
        error: userError
    } = await client.auth.getUser(
        session.access_token
    );


    if(
        !userError &&
        userData?.user
    ){

        console.log(
            "Aktif kullanıcı:",
            userData.user.id
        );

        return {
            session: session,
            user: userData.user
        };

    }


    /* 5 - İlk doğrulama başarısızsa token yenile */

    console.warn(
        "Mevcut token doğrulanamadı. Oturum yenileniyor..."
    );


    const refreshed =
        await client.auth.refreshSession();


    if(
        refreshed.error ||
        !refreshed.data?.session
    ){

        console.error(
            "Oturum yenilenemedi:",
            refreshed.error
        );

        return null;
    }


    const yeniSession =
        refreshed.data.session;


    const {
        data: yeniUserData,
        error: yeniUserError
    } =
    await client.auth.getUser(
        yeniSession.access_token
    );


    if(
        yeniUserError ||
        !yeniUserData?.user
    ){

        console.error(
            "Yeni oturum doğrulanamadı:",
            yeniUserError
        );

        return null;
    }


    console.log(
        "Oturum başarıyla yenilendi:",
        yeniUserData.user.id
    );


    return {
        session: yeniSession,
        user: yeniUserData.user
    };
}


/* =====================================================
   MÜŞTERİ KAYDET
===================================================== */

async function musteriKaydet(){

    const ad =
        document.getElementById("adSoyad")
        ?.value.trim() || "";

    const telefon =
        document.getElementById("telefon")
        ?.value.trim() || "";

    const adres =
        document.getElementById("adres")
        ?.value.trim() || "";

    const alim =
        document.getElementById("alimTarihi")
        ?.value || null;

    const teslim =
        document.getElementById("teslimTarihi")
        ?.value || null;

    const m2Value =
        document.getElementById("haliM2")
        ?.value || "";

    const tutarValue =
        document.getElementById("tutar")
        ?.value || "";

    const m2 =
        m2Value !== ""
        ? Number(m2Value)
        : null;

    const tutar =
        tutarValue !== ""
        ? Number(tutarValue)
        : null;

    const notlar =
        document.getElementById("notlar")
        ?.value.trim() || "";


    /* AD KONTROL */

    if(!ad){

        document.getElementById("saveMessage")
        .innerHTML =
        '<div class="message error">' +
        '⚠️ Ad Soyad gir.' +
        '</div>';

        return;
    }


    /* MESAJ */

    document.getElementById("saveMessage")
    .innerHTML =
    '<div class="message">' +
    '⏳ Oturum kontrol ediliyor...' +
    '</div>';


    /* OTURUM */

    const aktif =
        await aktifOturumuAl();


    if(!aktif){

        document.getElementById("saveMessage")
        .innerHTML =
        '<div class="message error">' +
        '❌ Oturum geçerli değil. Lütfen çıkış yapıp tekrar giriş yap.' +
        '</div>';

        return;
    }


    const user =
        aktif.user;


    console.log(
        "Kayıt yapılacak kullanıcı:",
        user.id
    );


    /* KAYIT */

    const kayit = {

        user_id: user.id,

        ad_soyad: ad,

        telefon: telefon,

        adres: adres,

        alim_tarihi: alim,

        teslim_tarihi: teslim,

        hali_m2: m2,

        tutar: tutar,

        notlar: notlar

    };


    document.getElementById("saveMessage")
    .innerHTML =
    '<div class="message">' +
    '⏳ Müşteri kaydediliyor...' +
    '</div>';


    const {
        data,
        error
    } =
    await client
    .from("Müşteriler")
    .insert(kayit)
    .select()
    .single();


    if(error){

        console.error(
            "Müşteri kayıt hatası:",
            error
        );


        document.getElementById("saveMessage")
        .innerHTML =
        '<div class="message error">' +
        '❌ Kayıt yapılamadı:<br>' +
        guvenli(error.message) +
        '</div>';

        return;
    }


    console.log(
        "Kayıt başarılı:",
        data
    );


    document.getElementById("saveMessage")
    .innerHTML =
    '<div class="message success">' +
    '✅ Müşteri başarıyla kaydedildi!' +
    '</div>';


    formTemizle();


    await musterileriGetir();

}


/* =====================================================
   FORM TEMİZLE
===================================================== */

function formTemizle(){

    const alanlar = [
        "adSoyad",
        "telefon",
        "adres",
        "alimTarihi",
        "teslimTarihi",
        "haliM2",
        "tutar",
        "notlar"
    ];

    alanlar.forEach(function(id){

        const el =
            document.getElementById(id);

        if(el){
            el.value = "";
        }

    });
}


/* =====================================================
   MÜŞTERİLERİ GETİR
===================================================== */

async function musterileriGetir(){

    const aktif =
        await aktifOturumuAl();


    if(!aktif){

        console.warn(
            "Müşteriler için geçerli oturum yok."
        );

        return;
    }


    const {
        data,
        error
    } =
    await client
    .from("Müşteriler")
    .select("*")
    .order(
        "created_at",
        {
            ascending:false
        }
    );


    if(error){

        console.error(
            "Müşteriler alınamadı:",
            error
        );


        const liste =
            document.getElementById(
                "musteriListesi"
            );


        if(liste){

            liste.innerHTML =
            '<div class="message error">' +
            '❌ Veriler alınamadı:<br>' +
            guvenli(error.message) +
            '</div>';

        }

        return;
    }


    const musteriler =
        data || [];


    /* ARAMA */

    const arama =
        (
            document.getElementById("arama")
            ?.value || ""
        )
        .trim()
        .toLowerCase();


    const filtreli =
        musteriler.filter(function(m){

            if(!arama){
                return true;
            }

            return (

                String(m.ad_soyad || "")
                .toLowerCase()
                .includes(arama)

                ||

                String(m.telefon || "")
                .toLowerCase()
                .includes(arama)

            );

        });


    /* TOPLAM */

    const toplamM2 =
        musteriler.reduce(
            function(toplam,m){

                return toplam +
                Number(m.hali_m2 || 0);

            },
            0
        );


    const toplamTutar =
        musteriler.reduce(
            function(toplam,m){

                return toplam +
                Number(m.tutar || 0);

            },
            0
        );


    const elToplamMusteri =
        document.getElementById(
            "toplamMusteri"
        );

    if(elToplamMusteri){
        elToplamMusteri.textContent =
            musteriler.length;
    }


    const elToplamIs =
        document.getElementById(
            "toplamIs"
        );

    if(elToplamIs){
        elToplamIs.textContent =
            musteriler.length;
    }


    const elToplamM2 =
        document.getElementById(
            "toplamM2"
        );

    if(elToplamM2){
        elToplamM2.textContent =
            toplamM2.toLocaleString(
                "tr-TR"
            );
    }


    const elToplamTutar =
        document.getElementById(
            "toplamTutar"
        );

    if(elToplamTutar){
        elToplamTutar.textContent =
            toplamTutar.toLocaleString(
                "tr-TR"
            ) + " TL";
    }


    const elKasaToplam =
        document.getElementById(
            "kasaToplam"
        );

    if(elKasaToplam){
        elKasaToplam.textContent =
            toplamTutar.toLocaleString(
                "tr-TR"
            ) + " TL";
    }


    const elKasaM2 =
        document.getElementById(
            "kasaM2"
        );

    if(elKasaM2){
        elKasaM2.textContent =
            toplamM2.toLocaleString(
                "tr-TR"
            );
    }


    /* MÜŞTERİ LİSTESİ */

    const liste =
        document.getElementById(
            "musteriListesi"
        );


    if(liste){

        if(!filtreli.length){

            liste.innerHTML =
            '<div class="empty">' +
            '👥 Henüz müşteri kaydı yok.' +
            '</div>';

        }else{

            liste.innerHTML =

            filtreli.map(function(m){

                return `

                <div class="customer">

                    <div class="customer-name">
                        ${guvenli(m.ad_soyad)}
                    </div>

                    <div class="customer-phone">
                        📞 ${guvenli(m.telefon || "-")}
                    </div>

                    <div class="customer-info">

                        📍 ${guvenli(m.adres || "-")}<br>

                        📅 Alım:
                        ${guvenli(m.alim_tarihi || "-")}<br>

                        🚚 Teslim:
                        ${guvenli(m.teslim_tarihi || "-")}<br>

                        🧼 ${m.hali_m2 ?? 0} m²
                        &nbsp; • &nbsp;
                        💰 ${m.tutar ?? 0} TL

                        ${
                            m.notlar
                            ?
                            "<br>📝 " +
                            guvenli(m.notlar)
                            :
                            ""
                        }

                    </div>

                    <div class="actions">

                        <button
                            class="action"
                            onclick="ara('${telefonJS(m.telefon)}')">
                            📞 Ara
                        </button>

                        <button
                            class="action green"
                            onclick="whatsapp('${telefonJS(m.telefon)}')">
                            💬 WhatsApp
                        </button>

                        <button
                            class="action red"
                            onclick="musteriSil('${m.id}')">
                            🗑️ Sil
                        </button>

                    </div>

                </div>

                `;

            }).join("");

        }

    }


    /* İŞLER */

    const isArama =
        (
            document.getElementById("isArama")
            ?.value || ""
        )
        .trim()
        .toLowerCase();


    const isler =
        musteriler.filter(function(m){

            if(!isArama){
                return true;
            }

            return (

                String(m.ad_soyad || "")
                .toLowerCase()
                .includes(isArama)

                ||

                String(m.telefon || "")
                .toLowerCase()
                .includes(isArama)

            );

        });


    const islerListesi =
        document.getElementById(
            "islerListesi"
        );


    if(islerListesi){

        islerListesi.innerHTML =

            isler.length

            ?

            isler.map(function(m){

                return `

                <div class="customer">

                    <div class="customer-name">
                        ${guvenli(m.ad_soyad)}
                    </div>

                    <div class="customer-info">

                        📅 Alım:
                        ${guvenli(m.alim_tarihi || "-")}<br>

                        🚚 Teslim:
                        ${guvenli(m.teslim_tarihi || "-")}<br>

                        🧼 ${m.hali_m2 ?? 0} m²
                        &nbsp; • &nbsp;
                        💰 ${m.tutar ?? 0} TL

                    </div>

                </div>

                `;

            }).join("")

            :

            '<div class="empty">' +
            'İş bulunamadı.' +
            '</div>';

    }


    /* KASA */

    const kasaListe =
        document.getElementById(
            "kasaListe"
        );


    if(kasaListe){

        kasaListe.innerHTML =

            musteriler.length

            ?

            musteriler
            .slice(0,10)
            .map(function(m){

                return `

                <div class="customer">

                    <div class="customer-name">
                        ${guvenli(m.ad_soyad)}
                    </div>

                    <div class="customer-info">
                        💰 ${m.tutar ?? 0} TL<br>
                        🧼 ${m.hali_m2 ?? 0} m²
                    </div>

                </div>

                `;

            }).join("")

            :

            '<div class="empty">' +
            'Henüz kayıt yok.' +
            '</div>';

    }


    /* YAKLAŞAN TESLİMLER */

    const teslimler =
        musteriler
        .filter(function(m){

            return !!m.teslim_tarihi;

        })
        .sort(function(a,b){

            return String(a.teslim_tarihi)
                .localeCompare(
                    String(b.teslim_tarihi)
                );

        })
        .slice(0,5);


    const yaklasan =
        document.getElementById(
            "yaklasanIsler"
        );


    if(yaklasan){

        yaklasan.innerHTML =

            teslimler.length

            ?

            teslimler.map(function(m){

                return `

                <div class="customer">

                    <div class="customer-name">
                        ${guvenli(m.ad_soyad)}
                    </div>

                    <div class="customer-info">

                        🚚 Teslim:
                        ${guvenli(m.teslim_tarihi)}<br>

                        💰 ${m.tutar ?? 0} TL

                    </div>

                </div>

                `;

            }).join("")

            :

            '<div class="empty">' +
            'Yaklaşan teslimat yok.' +
            '</div>';

    }

}


/* =====================================================
   TELEFON
===================================================== */

function telefonJS(text){

    return String(text || "")
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'");
}


function ara(telefon){

    const temiz =
        String(telefon)
        .replace(/\D/g,"");


    if(!temiz){

        alert(
            "Telefon numarası bulunamadı."
        );

        return;
    }


    location.href =
        "tel:" + temiz;
}


function whatsapp(telefon){

    let temiz =
        String(telefon)
        .replace(/\D/g,"");


    if(!temiz){

        alert(
            "Telefon numarası bulunamadı."
        );

        return;
    }


    if(temiz.startsWith("0")){

        temiz =
            "90" +
            temiz.substring(1);

    }


    if(!temiz.startsWith("90")){

        temiz =
            "90" + temiz;

    }


    window.open(
        "https://wa.me/" +
        temiz,
        "_blank"
    );
}


/* =====================================================
   MÜŞTERİ SİL
===================================================== */

async function musteriSil(id){

    if(!confirm(
        "Bu müşteriyi silmek istediğine emin misin?"
    )){

        return;
    }


    const aktif =
        await aktifOturumuAl();


    if(!aktif){

        alert(
            "Oturum bulunamadı. Lütfen tekrar giriş yap."
        );

        return;
    }


    const {
        error
    } =
    await client
    .from("Müşteriler")
    .delete()
    .eq("id",id);


    if(error){

        console.error(
            "Silme hatası:",
            error
        );

        alert(
            "Silinemedi: " +
            error.message
        );

        return;
    }


    await musterileriGetir();
}


/* =====================================================
   TARİH
===================================================== */

function bugunGoster(){

    const tarih =
        new Date();

    const el =
        document.getElementById(
            "bugunTarihi"
        );


    if(el){

        el.textContent =
            tarih.toLocaleDateString(
                "tr-TR",
                {
                    weekday:"long",
                    day:"numeric",
                    month:"long",
                    year:"numeric"
                }
            );

    }
}


/* =====================================================
   UYGULAMAYI AÇ
===================================================== */

async function uygulamayiAc(){

    bugunGoster();

    await musterileriGetir();
}


/* =====================================================
   AUTH DEĞİŞİKLİĞİ
===================================================== */

client.auth.onAuthStateChange(
    function(event, session){

        console.log(
            "Supabase Auth:",
            event
        );


        /*
         * Async işlemi doğrudan callback içinde
         * çalıştırmıyoruz.
         */

        if(
            event === "SIGNED_IN" ||
            event === "INITIAL_SESSION" ||
            event === "TOKEN_REFRESHED"
        ){

            if(session){

                setTimeout(
                    function(){

                        uygulamayiAc();

                    },
                    0
                );

            }

        }


        if(event === "SIGNED_OUT"){

            console.log(
                "Kullanıcı çıkış yaptı."
            );

        }

    }
);


/* =====================================================
   OTURUM KONTROL
===================================================== */

async function oturumKontrol(){

    console.log(
        "Parlak Clean başlatılıyor..."
    );


    const aktif =
        await aktifOturumuAl();


    if(aktif){

        console.log(
            "Oturum hazır:",
            aktif.user.id
        );


        await uygulamayiAc();

    }else{

        console.warn(
            "Geçerli oturum bulunamadı."
        );

        const liste =
            document.getElementById(
                "musteriListesi"
            );


        if(liste){

            liste.innerHTML =
            '<div class="message error">' +
            '❌ Oturum bulunamadı.<br>' +
            'Lütfen giriş ekranından tekrar giriş yap.' +
            '</div>';

        }

    }

}


/* =====================================================
   ÇIKIŞ
===================================================== */

async function logout(){

    const {
        error
    } =
    await client.auth.signOut();


    if(error){

        console.error(
            "Çıkış hatası:",
            error
        );

    }


    location.reload();
}


/* =====================================================
   BAŞLAT
===================================================== */

bugunGoster();

oturumKontrol();

</script>
